<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="cZw-j_R3HyR2Mt8L0sUoBmIKHdIp8CL0Q8oSukStxv4" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectre - Private Search Engine</title>
    <style>
        body {
            /* Reduced opacity from 0.85 to 0.42 to let 50% more light through */
              background: linear-gradient(rgba(13, 15, 18, 0.42), rgba(13, 15, 18, 0.42)), url('/templates/backgrounds/image.png') no-repeat center center fixed; 
              background-size: cover; 
                  color: #e0e0e0; 
              font-family: 'segoe ui', tahoma, geneva, verdana, sans-serif; 
              display: flex; 
              flex-direction: column; 
              align-items: center; 
              justify-content: center; 
              height: 100vh; 
              margin: 0; 
}

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #00adb5;
            letter-spacing: 4px;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(0, 173, 181, 0.6);
        }
        form {
            width: 100%;
            max-width: 600px;
            display: flex;
            backdrop-filter: blur(4px); /* Sleek glassmorphism behind the input bar */
        }
        input[type="text"] {
            width: 80%;
            padding: 15px;
            border: 2px solid #1f232a;
            border-radius: 8px 0 0 8px;
            background-color: rgba(22, 26, 34, 0.9);
            color: #fff;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #00adb5;
        }
        button {
            width: 20%;
            padding: 15px;
            border: none;
            background-color: #00adb5;
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #007a80;
        }
        .tagline {
            color: #a0aec0;
            font-size: 0.9rem;
            margin-top: 15px;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <h1>SPECTRE</h1>
    <form action="/search" method="GET">
        <input type="text" name="q" placeholder="Search Without Being Searched..." autocomplete="off" required>
        <button type="submit">Go</button>
    </form>
    <div class="tagline">Built to find answers, not collect data.</div>

</body>
</html>
